<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — BAVA BGM</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --pink-100: #fff1f6;
            --pink-200: #ffe1ec;
            --pink-400: #ffb8d1;
            --pink-500: #f79cbb;
            --pink-600: #e888a9;
            --pink-700: #d4769a;
            --ink-800: #82536a;
            --ink-700: #96657d;
            --ink-500: #bf93a6;
            --f-display: "Cormorant Garamond", serif;
            --f-body: "Manrope", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--f-body);
            background: var(--pink-100);
            color: var(--ink-800);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-family: var(--f-display);
            font-size: 2.5rem;
            color: var(--ink-800);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--ink-500);
            font-size: 0.9rem;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(200, 116, 156, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .login-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 99px;
            border: 1px solid #ffd8e7;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
        }

        .login-box input:focus {
            border-color: var(--pink-400);
        }

        .btn {
            padding: 14px 32px;
            border-radius: 99px;
            border: none;
            background: linear-gradient(160deg, var(--pink-400), var(--pink-600));
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .error {
            color: var(--pink-700);
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }

        #adminContent {
            display: none;
            width: 100%;
            max-width: 1200px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            border-radius: 99px;
            border: 1px solid white;
            background: rgba(255, 255, 255, 0.6);
            color: var(--ink-700);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: white;
        }

        .tab.active {
            background: linear-gradient(160deg, var(--pink-400), var(--pink-600));
            color: white;
            border-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .photo-card {
            background: white;
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(200, 116, 156, 0.1);
            display: flex;
            flex-direction: column;
        }

        .photo-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--ink-700);
            margin-bottom: 10px;
            min-height: 2.4em;
            line-height: 1.3;
        }

        .preview-wrap {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 10px;
            overflow: hidden;
            background: var(--pink-100);
            margin-bottom: 12px;
        }

        .preview-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .mini-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ffd8e7;
            background: white;
            color: var(--ink-700);
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .mini-btn:hover {
            background: var(--pink-100);
            color: var(--pink-700);
        }

        .url-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ffd8e7;
            font-size: 0.75rem;
            outline: none;
        }

        .url-input:focus {
            border-color: var(--pink-400);
        }

        .footer {
            display: flex;
            gap: 16px;
            justify-content: center;
            padding-top: 30px;
            border-top: 1px solid #ffd8e7;
        }

        .footer .btn {
            width: auto;
            padding: 14px 28px;
            background: white;
            color: var(--ink-800);
            border: 1px solid #ffd8e7;
        }

        .footer .btn:hover {
            background: var(--pink-100);
        }

        .footer .btn.danger {
            background: #ffe3e3;
            color: #d4769a;
            border-color: #ffb8d1;
        }

        .footer .btn.danger:hover {
            background: #ffd1d1;
        }

        .note {
            text-align: center;
            color: var(--ink-500);
            font-size: 0.8rem;
            margin-top: 30px;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            place-items: center;
            background: rgba(255, 241, 246, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .loading-overlay.on {
            display: grid;
        }

        .loading-box {
            background: white;
            padding: 32px 44px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(200, 116, 156, 0.3);
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 18px;
            border: 4px solid #ffe1ec;
            border-top-color: #e888a9;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 0.9rem;
            color: var(--ink-700);
            font-weight: 500;
        }

        .loading-sub {
            font-size: 0.72rem;
            color: var(--ink-500);
            margin-top: 6px;
        }

        /* Save button state */
        .mini-btn.save-btn {
            background: linear-gradient(160deg, #ffb8d1, #e888a9);
            color: white;
            border-color: transparent;
            font-weight: 500;
        }

        .mini-btn.save-btn:hover {
            background: linear-gradient(160deg, #e888a9, #d4769a);
            color: white;
        }

        .mini-btn.cancel-btn {
            background: #f5f5f5;
            color: #666;
        }

        .mini-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .dirty-badge {
            display: none;
            font-size: 0.62rem;
            color: #d4769a;
            background: #ffe3e3;
            padding: 3px 8px;
            border-radius: 99px;
            margin-bottom: 6px;
            text-align: center;
            font-weight: 500;
        }

        .dirty-badge.on {
            display: block;
        }

        /* ==============================================================
           GLOBAL SAVE BAR
           ============================================================== */
        .save-bar {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%) translateY(140px);
            background: white;
            padding: 12px 16px;
            border-radius: 99px;
            box-shadow: 0 14px 44px rgba(200, 116, 156, 0.38);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9998;
            transition: transform 0.45s cubic-bezier(0.19, 1, 0.22, 1);
            max-width: calc(100vw - 32px);
            border: 1px solid #ffd8e7;
        }

        .save-bar.on {
            transform: translateX(-50%) translateY(0);
        }

        .save-bar-text {
            font-size: 0.82rem;
            color: var(--ink-700);
            font-weight: 500;
            white-space: nowrap;
            padding-left: 6px;
        }

        .save-bar-text .count {
            display: inline-block;
            background: #ffe3e3;
            color: #d4769a;
            border-radius: 99px;
            padding: 2px 9px;
            font-size: 0.72rem;
            margin-right: 4px;
            font-weight: 600;
        }

        .save-bar .btn {
            width: auto;
            padding: 11px 22px;
            font-size: 0.8rem;
        }

        .save-bar .btn.ghost {
            background: white;
            color: var(--ink-700);
            border: 1px solid #ffd8e7;
        }

        .save-bar .btn.ghost:hover {
            background: var(--pink-100);
            transform: none;
        }

        @media (max-width: 520px) {
            .save-bar {
                flex-direction: column;
                padding: 14px;
                border-radius: 20px;
                gap: 10px;
            }

            .save-bar .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Admin Panel</h1>
        <p>Manage all photos for BAVA BGM</p>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Uploading...</p>
            <p class="loading-sub">Please wait</p>
        </div>
    </div>

    <div id="loginBox" class="login-box">
        <p style="margin-bottom:20px; color:var(--ink-500); font-size:0.9rem;">Enter admin password:</p>
        <input type="password" id="adminPassword" placeholder="Password">
        <button class="btn" id="loginBtn">Unlock 🔐</button>
        <p class="error" id="loginError">Wrong password. Try again.</p>
    </div>

    <div id="adminContent">
        <div class="tabs">
            <button class="tab active" data-tab="main">Main Photos (13)</button>
            <button class="tab" data-tab="film">Film Photos (22)</button>
            <button class="tab" data-tab="secret">Secret Gallery</button>
            <button class="tab" id="addSecretBtn" type="button"
                style="background:#d4769a;color:white;border-color:transparent">➕ Add Secret Photo</button>
            <button class="tab" data-tab="goofball">My Favorite Goofball</button>
            <button class="tab" id="addGoofballBtn" type="button"
                style="background:#d4769a;color:white;border-color:transparent">➕ Add Goofball Photo</button>
        </div>
        <div class="grid" id="photoGrid"></div>
        <div class="footer">
            <button class="btn" id="supabaseBtn">☁ Supabase Setup</button>
            <button class="btn" id="exportBtn">Export Backup ⬇</button>
            <button class="btn danger" id="resetBtn">Reset All ↺</button>
        </div>
        <p class="note">Photos upload to your Supabase bucket. Nothing is saved until you press
            <strong>Save Changes</strong>. Use Export Backup to keep a copy.
        </p>
    </div>

    <!-- ==============================================================
         GLOBAL SAVE BAR
         ============================================================== -->
    <div class="save-bar" id="saveBar">
        <span class="save-bar-text" id="saveBarText">You have unsaved changes</span>
        <button class="btn" id="globalSaveBtn" type="button">💾 Save Changes</button>
        <button class="btn ghost" id="globalDiscardBtn" type="button">Discard</button>
    </div>

    <script>
        /* ==========================================================================
          CONFIGURATION
          ========================================================================== */
        const ADMIN_PASSWORD = "sanjubgm";
        const STORAGE_KEY = "bava_bgm_photos";
        const SETUP_KEY = "bava_supabase_setup";

        // Supabase credentials (loaded from setup)
        let SUPABASE_URL = "";
        let SUPABASE_ANON_KEY = "";
        let SUPABASE_BUCKET = "photos";
        try {
            const s = JSON.parse(localStorage.getItem(SETUP_KEY) || "{}");
            SUPABASE_URL = s.url || "";
            SUPABASE_ANON_KEY = s.key || "";
            SUPABASE_BUCKET = s.bucket || "photos";
        } catch (e) { }

        // Empty config that matches your main site
        const CONFIG = {
            photos: Array(13).fill(""),
            filmPhotos: {
                portrait: "", final: "",
                m1: "", m2: "", m3: "", m4: "", m5: "",
                c1: "", c2: "", c3: "", c4: "", c5: "", c6: "",
                h1: "", h2: "", h3: "", h4: "", h5: "",
                h6: "", h7: "", h8: "", h9: "", h10: ""
            },
            secretPhotos: ["", "", "", ""],
            goofballPhotos: ["", "", "", ""],
            adjustments: {}
        };

        // Load saved photos from browser memory
        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
            if (saved.photos) saved.photos.forEach((p, i) => { if (i < 13) CONFIG.photos[i] = p; });
            if (saved.filmPhotos) Object.keys(saved.filmPhotos).forEach(k => { if (CONFIG.filmPhotos[k] !== undefined) CONFIG.filmPhotos[k] = saved.filmPhotos[k]; });
            if (saved.secretPhotos) CONFIG.secretPhotos = saved.secretPhotos;
            if (saved.goofballPhotos) CONFIG.goofballPhotos = saved.goofballPhotos;
            if (saved.adjustments) CONFIG.adjustments = saved.adjustments;
        } catch (e) { console.warn("No saved photos yet."); }

        /* ==========================================================================
           LABELS
           ========================================================================== */
        const MAIN_LABELS = [
            "Timeline — The Beginning",
            "Timeline — Our First Memories",
            "Timeline — The Little Things",
            "Timeline — The Best Moments",
            "Timeline — Today",
            "Timeline — Forever",
            "Gallery — Your Smile",
            "Gallery — Our Crazy Moments",
            "Gallery — That Beautiful Day",
            "Gallery — My Favorite Memory",
            "Gallery — Moments I Never Want To Forget",
            "Favorite Photo",
            "Finale Photo"
        ];

        const FILM_LABELS = {
            portrait: "Film — Portrait (Scene 3)",
            final: "Film — Finale (Scene 9)",
            m1: "Film — Montage 1", m2: "Film — Montage 2", m3: "Film — Montage 3",
            m4: "Film — Montage 4", m5: "Film — Montage 5",
            c1: "Film — Collage 1", c2: "Film — Collage 2", c3: "Film — Collage 3",
            c4: "Film — Collage 4", c5: "Film — Collage 5", c6: "Film — Collage 6",
            h1: "Film — Heart 1", h2: "Film — Heart 2", h3: "Film — Heart 3",
            h4: "Film — Heart 4", h5: "Film — Heart 5",
            h6: "Film — Heart 6", h7: "Film — Heart 7", h8: "Film — Heart 8",
            h9: "Film — Heart 9", h10: "Film — Heart 10"
        };

        /* ==========================================================================
           UI ELEMENTS
           ========================================================================== */
        const loginBox = document.getElementById("loginBox");
        const adminContent = document.getElementById("adminContent");
        const passwordInput = document.getElementById("adminPassword");
        const loginBtn = document.getElementById("loginBtn");
        const loginError = document.getElementById("loginError");
        const tabs = document.querySelectorAll(".tab");
        const photoGrid = document.getElementById("photoGrid");
        const exportBtn = document.getElementById("exportBtn");
        const resetBtn = document.getElementById("resetBtn");

        let currentTab = "main";

        /* ==========================================================================
           LOGIN
           ========================================================================== */
        loginBtn.addEventListener("click", () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                loginBox.style.display = "none";
                adminContent.style.display = "block";
                takeSnapshot();
                renderGrid();
            } else {
                loginError.style.display = "block";
                passwordInput.value = "";
                setTimeout(() => { loginError.style.display = "none"; }, 3000);
            }
        });

        passwordInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") loginBtn.click();
        });

        /* ==========================================================================
           TABS
           ========================================================================== */
        tabs.forEach(tab => {
            tab.addEventListener("click", () => {
                if (!tab.dataset.tab) return;
                tabs.forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                currentTab = tab.dataset.tab;
                renderGrid();
            });
        });

        /* ==========================================================================
           SAVE / LOAD
           ========================================================================== */
        async function saveConfigToSupabase() {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
            try {
                const blob = new Blob([JSON.stringify(CONFIG)], { type: 'application/json' });
                await fetch(
                    SUPABASE_URL + "/storage/v1/object/" + SUPABASE_BUCKET + "/config.json",
                    {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                            "apikey": SUPABASE_ANON_KEY,
                            "x-upsert": "true"
                        },
                        body: blob
                    }
                );
            } catch (e) { console.error("Failed to save config to cloud", e); }
        }

        function save() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(CONFIG));
                saveConfigToSupabase(); // This uploads the list to Supabase!
                return true;
            } catch (e) {
                alert("Could not save — browser storage is full.");
                return false;
            }
        }

        /* ==============================================================
           SNAPSHOT / DIRTY STATE
           Everything edits CONFIG in memory. The snapshot is what's
           actually persisted to localStorage. Only "Save Changes"
           commits CONFIG → localStorage (i.e. → the main page).
           ============================================================== */
        let SAVED_SNAPSHOT = null;

        function takeSnapshot() {
            SAVED_SNAPSHOT = JSON.stringify(CONFIG);
        }

        function isDirty() {
            return SAVED_SNAPSHOT !== null && JSON.stringify(CONFIG) !== SAVED_SNAPSHOT;
        }

        function changedKeysCount() {
            if (!SAVED_SNAPSHOT) return 0;
            const before = JSON.parse(SAVED_SNAPSHOT);
            let n = 0;
            const cmp = (a, b) => JSON.stringify(a) !== JSON.stringify(b);
            if (cmp(before.photos, CONFIG.photos)) n++;
            if (cmp(before.secretPhotos, CONFIG.secretPhotos)) n++;
            if (cmp(before.goofballPhotos, CONFIG.goofballPhotos)) n++;
            if (cmp(before.filmPhotos, CONFIG.filmPhotos)) n++;
            if (cmp(before.adjustments, CONFIG.adjustments)) n++;
            return n;
        }

        const saveBar = document.getElementById("saveBar");
        const saveBarText = document.getElementById("saveBarText");
        const globalSaveBtn = document.getElementById("globalSaveBtn");
        const globalDiscardBtn = document.getElementById("globalDiscardBtn");

        function updateSaveBar() {
            if (isDirty()) {
                const n = changedKeysCount();
                saveBarText.innerHTML =
                    '<span class="count">' + n + '</span> group' +
                    (n === 1 ? "" : "s") + ' of changes pending';
                saveBar.classList.add("on");
            } else {
                saveBar.classList.remove("on");
            }
        }

        /* Called from anywhere something changes in the editor */
        function markChanged() {
            updateSaveBar();
        }

        /* ---- Global Save: commit CONFIG → localStorage ---- */
        globalSaveBtn.addEventListener("click", () => {
            showLoading("Saving changes...");
            setTimeout(() => {
                if (save()) {
                    takeSnapshot();
                    updateSaveBar();
                    renderGrid();
                }
                hideLoading();
            }, 220);
        });

        /* ---- Discard: restore CONFIG from snapshot ---- */
        globalDiscardBtn.addEventListener("click", () => {
            if (!isDirty()) return;
            if (!confirm("Discard all unsaved changes?")) return;
            const snap = JSON.parse(SAVED_SNAPSHOT);
            CONFIG.photos = snap.photos;
            CONFIG.filmPhotos = snap.filmPhotos;
            CONFIG.secretPhotos = snap.secretPhotos;
            CONFIG.goofballPhotos = snap.goofballPhotos;
            CONFIG.adjustments = snap.adjustments;
            updateSaveBar();
            renderGrid();
        });

        function showLoading(text) {
            document.getElementById("loadingText").textContent = text || "Uploading...";
            document.getElementById("loadingOverlay").classList.add("on");
        }
        function hideLoading() {
            document.getElementById("loadingOverlay").classList.remove("on");
        }


        function getValue(key) {
            if (key.startsWith("photos[")) return CONFIG.photos[parseInt(key.match(/\d+/)[0])] || "";
            if (key.startsWith("secretPhotos[")) return CONFIG.secretPhotos[parseInt(key.match(/\d+/)[0])] || "";
            if (key.startsWith("goofballPhotos[")) return CONFIG.goofballPhotos[parseInt(key.match(/\d+/)[0])] || "";
            return CONFIG.filmPhotos[key] || "";
        }

        function setValue(key, val) {
            if (key.startsWith("photos[")) CONFIG.photos[parseInt(key.match(/\d+/)[0])] = val;
            else if (key.startsWith("secretPhotos[")) CONFIG.secretPhotos[parseInt(key.match(/\d+/)[0])] = val;
            else if (key.startsWith("goofballPhotos[")) CONFIG.goofballPhotos[parseInt(key.match(/\d+/)[0])] = val;
            else CONFIG.filmPhotos[key] = val;
        }

        function getPlaceholder(key) {
            const label = key.replace(/\[|\]|secretPhotos|photos|portrait|final|m|c|h/g, " ").trim() || "PHOTO";
            return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
                    <rect width="400" height="300" fill="#fff1f6"/>
                    <text x="200" y="150" font-family="Arial" font-size="16" fill="#d4769a" text-anchor="middle">${label.toUpperCase()}</text>
                </svg>
            `);
        }

        /* ==========================================================================
           SUPABASE UPLOAD
           ========================================================================== */
        async function uploadToSupabase(file) {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                throw new Error(
                    "Supabase is not configured. Click 'Supabase Setup' at the bottom of the page."
                );
            }
            const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
            const fileName = Date.now() + "-" + safeName;
            const res = await fetch(
                SUPABASE_URL + "/storage/v1/object/" + SUPABASE_BUCKET + "/" + fileName,
                {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                        "apikey": SUPABASE_ANON_KEY,
                        "x-upsert": "false"
                    },
                    body: file
                }
            );
            if (!res.ok) {
                const text = await res.text();
                throw new Error("Supabase upload failed: " + text);
            }
            return SUPABASE_URL + "/storage/v1/object/public/" + SUPABASE_BUCKET + "/" + fileName;
        }

        /* ==========================================================================
           RENDER GRID
           ========================================================================== */
        function renderGrid() {
            photoGrid.innerHTML = "";
            let items = [];

            if (currentTab === "main") {
                MAIN_LABELS.forEach((label, i) => items.push({ key: "photos[" + i + "]", label }));
            } else if (currentTab === "film") {
                Object.keys(FILM_LABELS).forEach(key => items.push({ key, label: FILM_LABELS[key] }));
            } else if (currentTab === "secret") {
                for (let i = 0; i < CONFIG.secretPhotos.length; i++) {
                    items.push({ key: "secretPhotos[" + i + "]", label: "Secret Gallery — Photo " + (i + 1), removable: true });
                }
            } else if (currentTab === "goofball") {
                for (let i = 0; i < CONFIG.goofballPhotos.length; i++) {
                    items.push({ key: "goofballPhotos[" + i + "]", label: "Goofball Photo " + (i + 1), removable: true });
                }
            }

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "photo-card";
                const savedSrc = getValue(item.key) || getPlaceholder(item.key);
                const adj = CONFIG.adjustments[item.key] || { x: 50, y: 50, zoom: 100 };

                card.innerHTML = `
                    <p class="photo-label">${item.label}</p>
                    <div class="preview-wrap">
                        <img src="${savedSrc}" style="object-position: ${adj.x}% ${adj.y}%; transform: scale(${adj.zoom / 100}); transform-origin: center;">
                    </div>
                    <div class="actions">
                        <label class="mini-btn">📁 Upload<input type="file" accept="image/*" hidden></label>
                        <button class="mini-btn clear-btn">🗑 Clear</button>
                        ${item.removable ? '<button class="mini-btn del-btn" style="background:#ffe3e3;color:#d4769a">✖ Delete</button>' : ''}
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;margin:6px 0;font-size:0.68rem">
                        <span style="min-width:40px">X</span>
                        <input type="range" min="0" max="100" value="${adj.x}" data-adj="x" style="flex:1;accent-color:#e888a9">
                        <span style="min-width:36px;text-align:right">${adj.x}%</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;margin:6px 0;font-size:0.68rem">
                        <span style="min-width:40px">Y</span>
                        <input type="range" min="0" max="100" value="${adj.y}" data-adj="y" style="flex:1;accent-color:#e888a9">
                        <span style="min-width:36px;text-align:right">${adj.y}%</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;margin:6px 0 10px;font-size:0.68rem">
                        <span style="min-width:40px">Zoom</span>
                        <input type="range" min="100" max="250" value="${adj.zoom}" data-adj="zoom" style="flex:1;accent-color:#e888a9">
                        <span style="min-width:36px;text-align:right">${adj.zoom}%</span>
                    </div>
                    <input type="text" class="url-input" placeholder="Or paste image URL...">
                `;

                const fileInput = card.querySelector('input[type="file"]');
                const previewImg = card.querySelector(".preview-wrap img");
                const clearBtn = card.querySelector(".clear-btn");
                const urlInput = card.querySelector(".url-input");

                const currentVal = getValue(item.key);
                if (currentVal && !currentVal.startsWith("data:")) urlInput.value = currentVal;

                // Sliders — write straight into CONFIG, flag dirty
                card.querySelectorAll("input[type=range]").forEach(slider => {
                    slider.addEventListener("input", (e) => {
                        const axis = slider.dataset.adj;
                        if (!CONFIG.adjustments[item.key]) {
                            CONFIG.adjustments[item.key] = { x: 50, y: 50, zoom: 100 };
                        }
                        CONFIG.adjustments[item.key][axis] = parseInt(e.target.value, 10);
                        const a = CONFIG.adjustments[item.key];
                        previewImg.style.objectPosition = `${a.x}% ${a.y}%`;
                        previewImg.style.transform = `scale(${a.zoom / 100})`;
                        slider.nextElementSibling.textContent = e.target.value + "%";
                        markChanged();
                    });
                });

                // Upload — sends the file to Supabase Storage, keeps the returned URL
                fileInput.addEventListener("change", async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    e.target.value = "";
                    showLoading("Uploading to Supabase...");
                    try {
                        const finalUrl = await uploadToSupabase(file);
                        setValue(item.key, finalUrl);
                        previewImg.src = finalUrl;
                        urlInput.value = finalUrl;
                        markChanged();
                    } catch (err) {
                        alert(err.message || "Upload failed. Check your Supabase setup.");
                    } finally {
                        hideLoading();
                    }
                });

                // Clear — removes photo (still only in memory until Save)
                clearBtn.addEventListener("click", () => {
                    if (!confirm("Clear this photo?")) return;
                    setValue(item.key, "");
                    delete CONFIG.adjustments[item.key];
                    markChanged();
                    renderGrid();
                });

                // URL input — set via URL (still only in memory until Save)
                urlInput.addEventListener("change", () => {
                    const val = urlInput.value.trim();
                    setValue(item.key, val);
                    previewImg.src = val || getPlaceholder(item.key);
                    markChanged();
                });

                // Delete button (secret + goofball photos)
                const delBtn = card.querySelector(".del-btn");
                if (delBtn) {
                    delBtn.addEventListener("click", () => {
                        if (!confirm("Delete this photo?")) return;
                        const idx = parseInt(item.key.match(/\d+/)[0], 10);
                        if (item.key.startsWith("goofballPhotos[")) {
                            CONFIG.goofballPhotos.splice(idx, 1);
                        } else {
                            CONFIG.secretPhotos.splice(idx, 1);
                        }
                        markChanged();
                        renderGrid();
                    });
                }

                photoGrid.appendChild(card);
            });

            /* Refresh the bar any time the grid is rendered */
            updateSaveBar();
        }

        /* ==========================================================================
           EXPORT / RESET
           ========================================================================== */
        document.getElementById("addSecretBtn").addEventListener("click", () => {
            if (currentTab !== "secret") {
                document.querySelector('[data-tab="secret"]').click();
            }
            CONFIG.secretPhotos.push("");
            markChanged();
            renderGrid();
        });

        document.getElementById("addGoofballBtn").addEventListener("click", () => {
            if (currentTab !== "goofball") {
                document.querySelector('[data-tab="goofball"]').click();
            }
            CONFIG.goofballPhotos.push("");
            markChanged();
            renderGrid();
        });

        exportBtn.addEventListener("click", () => {
            const blob = new Blob([JSON.stringify(CONFIG, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "bava-bgm-backup.json";
            a.click();
            URL.revokeObjectURL(url);
        });

        resetBtn.addEventListener("click", () => {
            if (!confirm("Reset ALL photos? This cannot be undone.")) return;
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        });

        /* Warn before closing the tab if there are unsaved changes */
        window.addEventListener("beforeunload", (e) => {
            if (isDirty()) {
                e.preventDefault();
                e.returnValue = "";
            }
        });

        /* ==========================================================================
           SUPABASE SETUP BUTTON
           ========================================================================== */
        (function initSupabaseSetup() {
            const supabaseBtn = document.getElementById("supabaseBtn");
            if (!supabaseBtn) return;

            function refreshLabel() {
                supabaseBtn.textContent = (SUPABASE_URL && SUPABASE_ANON_KEY)
                    ? "☁ Supabase ✓"
                    : "☁ Supabase Setup";
            }
            refreshLabel();

            supabaseBtn.addEventListener("click", () => {
                const url = prompt(
                    "Supabase Project URL:\n(e.g. https://abcd1234.supabase.co)\n\nLeave empty to disable.",
                    SUPABASE_URL || ""
                );
                if (url === null) return;

                let key = "";
                let bucket = "photos";
                if (url.trim()) {
                    key = prompt("Supabase anon/public API key:", SUPABASE_ANON_KEY || "");
                    if (key === null) return;
                    bucket = prompt("Bucket name:", SUPABASE_BUCKET || "photos");
                    if (bucket === null) return;
                }

                SUPABASE_URL = url.trim().replace(/\/+$/, "");
                SUPABASE_ANON_KEY = key.trim();
                SUPABASE_BUCKET = (bucket.trim() || "photos");

                localStorage.setItem(SETUP_KEY, JSON.stringify({
                    url: SUPABASE_URL,
                    key: SUPABASE_ANON_KEY,
                    bucket: SUPABASE_BUCKET
                }));
                refreshLabel();

                alert(
                    (SUPABASE_URL && SUPABASE_ANON_KEY)
                        ? "Supabase connected ✓\n\nBucket: " + SUPABASE_BUCKET
                        : "Supabase disabled."
                );
            });
        })();

    </script>
</body>

</html>
